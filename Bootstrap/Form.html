<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Forms</h2>
      <form>
        <div class="mb-3">
          <label class="form-lebel" for="email">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="email"
          />
        </div>

        <div class="mb-3">
          <label class="form-lebel" for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="password"
          />
        </div>

        <div class="mb-3">
          <label class="form-lebel" for="address">Address</label>
          <input
            type="text"
            class="form-control-sm"
            id="address"
            placeholder="Enter address"
          />
        </div>
        <div class="mb-3">
          <select class="form-select">
            <option selected>Choose your city</option>
            <option value="1">Mumbai</option>
            <option value="2">Delhi</option>
            <option value="3">Pune</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="agree">Agree</label>
          <input type="checkbox" id="agree" />
        </div>

        <div class="mb-3 form-check">
          <label for="agreebs" class="form-check-label">Agree</label>
          <input type="checkbox" class="form-check-input" id="agree" />
        </div>

        <div class="mb-3 form-check">
          <label for="radiobs" class="form-check-label">Agree</label>
          <input type="radio" class="form-check-input" id="radiobs "/>
        </div>
        
      </form>
    </div>
  </body>
</html>
